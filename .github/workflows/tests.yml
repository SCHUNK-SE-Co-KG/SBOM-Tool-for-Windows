name: Tests

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install -r security/requirements.txt

      - name: Run Python tests
        run: python -m pytest tests/test_security.py -v

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0 -MaximumVersion 5.99.99
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $result = Invoke-Pester -Path tests/test_sbom.ps1 -PassThru -Output Minimal
          if ($result.FailedCount -gt 0) { exit 1 }
