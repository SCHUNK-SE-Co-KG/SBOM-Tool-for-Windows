name: Tests

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install -r security/requirements.txt

      - name: Run Python tests
        run: python -m pytest tests/test_security.py -v

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester tests (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Write-Host "Repo root: $env:GITHUB_WORKSPACE"
          $result = Invoke-Pester -Script tests/test_sbom.ps1 -PassThru
          Write-Host "Passed: $($result.PassedCount) Failed: $($result.FailedCount)"
          if ($result.FailedCount -gt 0) { exit 1 }
