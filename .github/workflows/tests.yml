name: Tests

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tests/requirements.txt
          pip install -r security/requirements.txt

      - name: Generate tool SBOM
        run: python security/generate_tool_sbom.py

      - name: Run Python tests
        run: python -m pytest tests/test_security.py tests/test_cyclonedx.py -v

      - name: Upload tool SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: tool-sbom
          path: security/reports/tool-sbom.cdx.json

      - name: Commit tool SBOM
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f security/reports/tool-sbom.cdx.json
          git diff --cached --quiet && exit 0
          git commit -m "docs: update tool dependency SBOM"
          git pull --rebase origin main
          git push

  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install and run Pester 5
        shell: powershell
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.7.1 -Force

          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/test_sbom.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $result = Invoke-Pester -Configuration $config
          Write-Host "Passed: $($result.PassedCount) Failed: $($result.FailedCount)"
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.21.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module PSScriptAnalyzer -RequiredVersion 1.21.0 -Force

      - name: Analyze PowerShell scripts
        shell: powershell
        run: |
          $scripts = @(
            'Get-WindowsSBOM.ps1',
            'Compare-WindowsSBOM.ps1'
          )
          $failed = $false
          foreach ($script in $scripts) {
            Write-Host "Analyzing $script ..."
            $findings = Invoke-ScriptAnalyzer -Path $script -Severity Error
            if ($findings) {
              $findings | Format-Table -AutoSize
              $failed = $true
            }
          }
          if ($failed) { throw 'PSScriptAnalyzer findings detected.' }
