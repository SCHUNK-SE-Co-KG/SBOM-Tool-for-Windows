name: Trivy Scan

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main, Development]
    paths:
      - '**.py'
      - '**.ps1'
      - 'tests/requirements.txt'
      - 'security/requirements.txt'
      - '.github/workflows/trivy-scan.yml'

permissions:
  contents: write
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare report directory
        run: mkdir -p security/reports

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          format: json
          output: security/reports/trivy-report.json
          exit-code: '0'

      - name: Generate Markdown summary
        if: always()
        run: |
          pip install -q -r security/requirements.txt || true
          if [ -f security/reports/trivy-report.json ]; then
            python security/parse_trivy_report.py security/reports/trivy-report.json
          else
            echo "No Trivy JSON report found, skipping Markdown generation."
            exit 0
          fi

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: |
            security/reports/trivy-report.json
            security/reports/trivy_report.md
          if-no-files-found: ignore

      - name: Commit Trivy reports
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f security/reports/trivy-report.json security/reports/trivy_report.md 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "security: Trivy scan report $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
